# Mini Rasso — site statique, aucun build.
[build]
  publish = "."
  command = ""
  # Le collecteur reecrit data/annonces.json toutes les 30 min via GitHub Actions.
  # Sans cette ligne, chaque passage declencherait un deploiement Netlify et
  # ferait exploser le quota de 300 minutes de build par mois.
  # Ici : on ne redeploie que si un fichier AUTRE que data/ a change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify sert les .webmanifest en application/octet-stream, et Chrome refuse
# alors le manifeste : le raccourci Android retombe sur une icone de secours.
# X-Content-Type-Options = nosniff, juste au-dessus, interdit au navigateur de
# deviner le bon type — il faut donc le declarer.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
