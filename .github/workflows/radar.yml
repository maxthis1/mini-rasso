name: Mini Rasso

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes (heure UTC)
  workflow_dispatch:          # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r collector/requirements.txt

      - name: Collecter les annonces
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collector/collect.py

      - name: Publier les donnees
        run: |
          git config user.name "radar-mini"
          git config user.email "radar@users.noreply.github.com"
          git add data/annonces.json
          git diff --staged --quiet || git commit -m "annonces $(date -u +'%d/%m %H:%M')"
          git push
