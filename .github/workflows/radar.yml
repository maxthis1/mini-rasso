name: Mini Rasso

# Le cron est volontairement debranche depuis le 3 septembre 2026.
#
# Deux raisons. D'abord il ne voyait presque rien : leParking, qui porte 84 %
# de la couverture, repond 403 depuis les IP de datacentre de GitHub, et il ne
# restait que 13 annonces sur 82. Ensuite, la collecte tourne desormais sur la
# machine de la maison (tache planifiee, collector/collecte-auto.ps1) et ecrit
# dans le meme data/annonces.json : deux ecrivains sur un fichier reecrit en
# entier a chaque passage, c'est un conflit toutes les demi-heures.
#
# Le declenchement manuel reste, il sert a verifier que le collecteur tourne
# encore sur une machine propre apres une modification.
on:
  workflow_dispatch:          # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r collector/requirements.txt

      - name: Collecter les annonces
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collector/collect.py

      - name: Publier les donnees
        run: |
          git config user.name "radar-mini"
          git config user.email "radar@users.noreply.github.com"
          git add data/annonces.json
          git diff --staged --quiet || git commit -m "annonces $(date -u +'%d/%m %H:%M')"
          git push
